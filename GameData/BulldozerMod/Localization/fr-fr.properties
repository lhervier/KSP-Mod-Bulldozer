# Mod-specific keys. Compiled to Localization/fr-fr.cfg at build time, prefixed
# with #LOC_BulldozerMod_. Common keys (OK/Cancel...) live in KSP-Shared.

clearScatters = Passer la lame (recharge la partie)
passLength = Longueur de la passe
passWidth = Largeur de la passe
clearFailed = La passe a échoué, voir KSP.log
headingUnusable = Le point de contrôle vise le ciel ou le sol : choisis-en un orienté vers l'avant (PAW « Point de contrôle »)
areaReserved = Nettoyage impossible ici : la zone est déjà réservée par <<1>>
highlightOn = Prévisualiser la passe (zone + rochers)
highlightOff = Arrêter l'aperçu
dumpPass = Analyser la passe (journal seulement)
dumpDone = Détail de la passe écrit dans KSP.log

# Fenêtre de debug (barre d'applications, en vol)
windowTitle = Bulldozer Debug
debugShowCleanedZones = Afficher les zones déjà nettoyées
debugShowDumpButton = Ajouter le bouton de diagnostic dans le PAW
debugLogLevel = Niveau de log

# Confirmation avant de passer la lame. Le geste use la lame ET recharge la partie : les deux
# doivent être dits avant, pas après.
confirmTitle = Passer la lame ?
confirmOk = Passer la lame
confirmMessage = Cette passe va user <<1>> cases de la lame.\n\nIl lui en reste <<2>> ; après la passe, il lui en restera <<3>>.\n\nLa partie va être sauvegardée puis RECHARGÉE : le nettoyage n'est appliqué qu'à la reconstruction du terrain. Rien d'autre n'est modifié - le rover retrouve exactement sa pose.

# Usure de la lame
bladeWear = Lame restante
bladeWearValue = <<1>> / <<2>> cases
passCost = Coût de cette passe
passCostValue = <<1>> cases
passCostUnknown = -
bladeWorn = Lame usée
notEnoughWear = Lame trop usée : cette passe demande <<1>> cases, il n'en reste que <<2>>. Raccourcis-la ou rétrécis-la.
nothingToClear = Déjà nettoyé : cette passe ne noircirait aucune case supplémentaire

# Position de la lame (mesurée par rapport au sol sous le tranchant, pas par rapport à l'horizon)
bladeClearance = Lame au-dessus du sol
bladeClearanceValue = <<1>> m
bladeClearanceTooHigh = <<1>> m - trop haut (max <<2>>)
bladeTilt = Inclinaison de la lame
bladeTiltValue = <<1>>°
bladeTiltTooSteep = <<1>>° - trop inclinée (max <<2>>)
bladeGroundUnknown = pas de sol
bladeNoGround = Pas de sol sous la lame
bladeTooHigh = Lame trop haute : elle est à <<1>> m du sol, descends-la à <<2>> m ou moins
bladeTooSteep = Lame mal alignée : elle penche de <<1>>° par rapport au sol, passe sous <<2>>°

# What the editor's part tooltip shows. The numbers come from BulldozerCleanModule.GetInfo(),
# so they follow the code; the ones repeated in the descriptions below do NOT.
moduleTitle = Lame de bulldozer
moduleInfo = Débarrasse de ses rochers Parallax une bande devant le rover, et s'use en le faisant.\n\n<b>Capacité :</b> <<1>> cases de 5 x 5 m\n<b>Passe :</b> <<2>> à <<3>> m de long, <<4>> à <<5>> m de large\n<b>Hauteur max au-dessus du sol :</b> <<6>> m\n<b>Inclinaison max par rapport au sol :</b> <<7>>°\n\nLa lame collisionne : laissée au sol, elle bloque le rover. Porte-la sur un axe robotisé et descends-la pour travailler.

# Pièces
bladeMk1Title = Lame de bulldozer BD-2 « Éclaireuse »
bladeMk2Title = Lame de bulldozer BD-3 « Chantier »
bladeMk3Title = Lame de bulldozer BD-5 « Terrassier »
bladeManufacturer = Kerlington Ground Works
bladeMk1Description = Une lame de 2 m pour débarrasser une aire d'atterrissage de ses rochers. Lourde pour sa taille, et elle s'use : 200 cases de 5 x 5 m, pas une de plus. Repasser sur du terrain déjà nettoyé ne coûte rien. Elle a de vrais colliders : laissée au sol, elle bloque le rover — monte-la sur un axe robotisé. Pour passer, son tranchant doit être à moins de 0,50 m du sol, et la lame alignée à moins de 15° de celui-ci.
bladeMk2Description = Une lame de 3 m taillée pour un vrai site de base. 600 cases de 5 x 5 m avant usure complète. Prévois un rover capable de la porter. Elle a de vrais colliders : laissée au sol, elle bloque le rover — monte-la sur un axe robotisé. Pour passer, son tranchant doit être à moins de 0,50 m du sol, et la lame alignée à moins de 15° de celui-ci.
bladeMk3Description = Une lame de 5 m, et 2000 cases de 5 x 5 m : de quoi dégager un complexe entier. Huit tonnes, soit un atterrisseur à elle seule. Non, elle ne te pavera pas une autoroute sur la Mune. Elle a de vrais colliders : laissée au sol, elle bloque le rover — monte-la sur un axe robotisé. Pour passer, son tranchant doit être à moins de 0,50 m du sol, et la lame alignée à moins de 15° de celui-ci.
bladeTags = bulldozer lame rocher caillou scatter terrain nettoyer parallax

# Livrées des lames (ModulePartVariants). Peinture seule : même masse, même coût, même géométrie
# et même quota d'usure. Ces noms sont ceux qu'affichent les pastilles de variante dans l'éditeur.
bladeVariantSteel = Acier brut
bladeVariantStainless = Inox poli
