# Mod-specific keys. Compiled to Localization/fr-fr.cfg at build time, prefixed
# with #LOC_BulldozerMod_. Common keys (OK/Cancel...) live in KSP-Shared.

clearScatters = Passer la lame (recharge la partie)
passLength = Longueur de la passe
passWidth = Largeur de la passe
clearFailed = La passe a échoué, voir KSP.log
headingUnusable = Le point de contrôle vise le ciel ou le sol : choisis-en un orienté vers l'avant (PAW « Point de contrôle »)
areaReserved = Nettoyage impossible ici : la zone est déjà réservée par <<1>>
highlightOn = Surligner les rochers qui partiraient
highlightOff = Arrêter le surlignage
dumpPass = Analyser la passe (journal seulement)
dumpDone = Détail de la passe écrit dans KSP.log
