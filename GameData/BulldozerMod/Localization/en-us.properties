# Mod-specific keys. Compiled to Localization/en-us.cfg at build time, prefixed
# with #LOC_BulldozerMod_. Common keys (OK/Cancel...) live in KSP-Shared.

clearScatters = Blade pass (reloads the game)
passLength = Pass length
passWidth = Pass width
clearFailed = Blade pass failed, see KSP.log
headingUnusable = The control point looks at the sky or at the ground: pick one aimed along the ground (PAW "Control Point")
areaReserved = Cannot clear here: the area is already reserved by <<1>>
highlightOn = Preview the pass (area + rocks)
highlightOff = Stop the preview
dumpPass = Dump what a pass would do (log only)
dumpDone = Pass details written to KSP.log

# Debug window (application launcher, in flight)
windowTitle = Bulldozer Debug
debugShowCleanedZones = Show the areas already cleared
debugShowDumpButton = Add the diagnostic button to the PAW
debugLogLevel = Log level

# Confirmation before a blade pass. The click both wears the blade out and reloads the game: both
# have to be said before, not after.
confirmTitle = Blade pass?
confirmOk = Run the pass
confirmMessage = This pass will wear <<1>> cells off the blade.\n\nIt has <<2>> left; after the pass it will have <<3>>.\n\nThe game will be saved and RELOADED: the clearing is only applied when the terrain is rebuilt. Nothing else changes - the rover comes back exactly where it is.

# Blade wear
bladeWear = Blade left
bladeWearValue = <<1>> / <<2>> cells
passCost = This pass costs
passCostValue = <<1>> cells
passCostUnknown = -
bladeWorn = Blade worn out
notEnoughWear = Blade too worn: this pass needs <<1>> cells, only <<2>> left. Shorten or narrow it.
nothingToClear = Already cleared: this pass would not blacken a single new cell

# Blade placement (measured against the ground under the cutting edge, not against the horizon)
bladeClearance = Blade over ground
bladeClearanceValue = <<1>> m
bladeClearanceTooHigh = <<1>> m - too high (max <<2>>)
bladeTilt = Blade tilt
bladeTiltValue = <<1>> deg
bladeTiltTooSteep = <<1>> deg - too steep (max <<2>>)
bladeGroundUnknown = no ground
bladeNoGround = No ground under the blade
bladeTooHigh = Blade too high: it rides <<1>> m over the ground, lower it to <<2>> m or less
bladeTooSteep = Blade not level: it leans <<1>> deg off the ground, bring it under <<2>> deg

# What the editor's part tooltip shows. The numbers come from BulldozerCleanModule.GetInfo(),
# so they follow the code; the ones repeated in the descriptions below do NOT.
moduleTitle = Bulldozer blade
moduleInfo = Clears the Parallax rocks off a strip ahead of the rover, and wears out doing it.\n\n<b>Capacity:</b> <<1>> cells of 5 x 5 m\n<b>Pass:</b> <<2>>-<<3>> m long, <<4>>-<<5>> m wide\n<b>Max height over ground:</b> <<6>> m\n<b>Max tilt off the ground:</b> <<7>> deg\n\nThe blade collides: left down, it pins the rover. Carry it on a robotic hinge and lower it to work.

# Parts
bladeMk1Title = BD-2 'Scout' Bulldozer Blade
bladeMk2Title = BD-3 'Worksite' Bulldozer Blade
bladeMk3Title = BD-5 'Groundbreaker' Bulldozer Blade
bladeManufacturer = Kerlington Ground Works
bladeMk1Description = A 2 m blade for clearing a landing pad of its rocks. Heavy for its size, and it wears out: 200 cells of 5 x 5 m, and not one more. Going back over ground you already cleared costs nothing. It has real colliders: left down it pins the rover, so plan for a robotic hinge. A pass needs its cutting edge within 0.50 m of the ground, and the blade within 15 deg of it.
bladeMk2Description = A 3 m blade sized for a real base site. 600 cells of 5 x 5 m before it is worn out. Bring a rover that can carry it. It has real colliders: left down it pins the rover, so plan for a robotic hinge. A pass needs its cutting edge within 0.50 m of the ground, and the blade within 15 deg of it.
bladeMk3Description = A 5 m blade, and 2000 cells of 5 x 5 m: enough to clear a whole complex. Eight tonnes of it, which is a lander of its own. No, it will not pave you a road across the Mun. It has real colliders: left down it pins the rover, so plan for a robotic hinge. A pass needs its cutting edge within 0.50 m of the ground, and the blade within 15 deg of it.
bladeTags = bulldozer blade scatter rock clear ground terrain parallax

# Blade liveries (ModulePartVariants). Paint only: same mass, same cost, same geometry, and the
# same wear quota. The names are what the variant swatches show in the editor.
bladeVariantSteel = Raw steel
bladeVariantStainless = Polished stainless
