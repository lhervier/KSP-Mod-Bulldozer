# Mod-specific keys. Compiled to Localization/en-us.cfg at build time, prefixed
# with #LOC_BulldozerMod_. Common keys (OK/Cancel...) live in KSP-Shared.

clearScatters = Blade pass (reloads the game)
passLength = Pass length
passWidth = Pass width
clearFailed = Blade pass failed, see KSP.log
headingUnusable = The control point looks at the sky or at the ground: pick one aimed along the ground (PAW "Control Point")
areaReserved = Cannot clear here: the area is already reserved by <<1>>
highlightOn = Highlight rocks that would go
highlightOff = Stop highlighting rocks
dumpPass = Dump what a pass would do (log only)
dumpDone = Pass details written to KSP.log
