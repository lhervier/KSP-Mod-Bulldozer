// Puts the blade-pass PAW entry (and its length slider) on every command module.
// Temporary: the real mod will carry it on a dedicated bulldozer blade part, which will also
// settle which way "forward" is without asking the control point.
@PART[*]:HAS[@MODULE[ModuleCommand]]:FINAL
{
    MODULE
    {
        name = BulldozerCleanModule
    }
}
